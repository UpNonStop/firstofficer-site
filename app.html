/* ===========================================================================
   Your First Officer, the owner's app.

   The page renders. It never computes. Every figure below arrives from
   fo_app_state already composed and already formatted, because L2 says the
   money is the database's business and a client surface is the last place to
   break that. There is no arithmetic in this file. If a number is not in the
   payload, the screen does not show it.
   =========================================================================== */
:root{
  --pink:#FA1896; --pink-lift:#FF5CB8; --pink-soft:#FFF0F7; --pink-deep:#C40F75;
  --green:#0d6e3a; --green-lift:#12b45f; --green-soft:#e8f7ef;
  --red:#B4241C;   --red-lift:#F2614E;   --red-soft:#FDEDEA;
  --blue:#12457F;  --blue-lift:#3E8FD8;  --blue-soft:#EAF2FB;
  --amber:#b06d0c; --amber-lift:#f0a93d; --amber-soft:#FBF1DD;
  --ink:#141210; --ink2:#4a453f; --ink3:#8b8177;
  --paper:#ffffff; --alt:#f7f5f2; --rule:#e7e3dd;
  --sect:var(--pink);
  --sans:'FO Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'FO Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f4f1ec; --ink2:#c3bcb2; --ink3:#8d857a;
  --paper:#141210; --alt:#1c1917; --rule:#2c2825;
  --pink-soft:#2a0d1c; --green-soft:#0c2418; --red-soft:#2a100c; --blue-soft:#0c1b2c;
}}
:root[data-theme="dark"]{
  --ink:#f4f1ec; --ink2:#c3bcb2; --ink3:#8d857a;
  --paper:#141210; --alt:#1c1917; --rule:#2c2825;
  --pink-soft:#2a0d1c; --green-soft:#0c2418; --red-soft:#2a100c; --blue-soft:#0c1b2c;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
/* A 5px accent, not a status-bar fill. Painting the safe area in the section
   colour put a pink stripe above a black hero on Home: two colours meeting at a
   hard edge under the notch. The hero paints its own ground all the way up; the
   rule is just the line. */
.rule{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--sect);height:5px}
/* In the app there is no browser chrome for this line to sit under, so it
   becomes a stripe across the notch. The app sets .inapp on <html>. */
.inapp .rule{display:none}
/* touch-action:manipulation drops the double-tap-to-zoom gesture and the 300ms
   click delay that comes with it. Only in the app: pinch zoom on the web page
   is an accessibility feature and stays. */
.inapp,.inapp *{touch-action:manipulation}

/* ---- the plan, in execution ----------------------------------------------- */
.meter{margin-top:18px}
.meter .track{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:#fff;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.meter .ends{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-top:9px;
  font:700 10px/1.35 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.meter .ends span:first-child{color:#fff;font-size:11.5px;white-space:nowrap}
.meter .ends span:last-child{text-align:right;font-size:9px;letter-spacing:.03em;
  opacity:.8;max-width:52%}

/* ---- hero ---------------------------------------------------------------- */
.hero{color:#fff;padding:calc(44px + env(safe-area-inset-top)) 20px 30px;position:relative;overflow:hidden}
.hero.earn  {background:linear-gradient(163deg,#12a054,var(--green) 52%,#04381f)}
.hero.burn  {background:linear-gradient(163deg,#D8382A,var(--red) 54%,#6B120D)}
.hero.return{background:linear-gradient(163deg,var(--pink),#E0107F 56%,#9C0A5C)}
.hero.learn {background:linear-gradient(163deg,#1E63AE,var(--blue) 52%,#08243F)}
.hero.home  {background:linear-gradient(163deg,#2b2724,#141210 60%,#0a0908)}
.hero::before{content:'';position:absolute;inset:0;z-index:0;
  background-image:var(--shot);background-size:cover;background-position:center 42%;
  opacity:.92}
.hero::after{content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,.16) 34%,rgba(0,0,0,.78) 100%)}
.hero.home  {--shot:url('img/cabin.jpg')}
.hero.earn  {--shot:url('img/newyork.jpg')}
.hero.burn  {--shot:url('img/tokyo.jpg')}
.hero.return{--shot:url('img/hotel.jpg')}
.hero.learn {--shot:url('img/rome.jpg')}
.hero .mk{position:absolute;right:-26px;top:10px;width:126px;height:172px;opacity:.16;color:#fff;z-index:2}
.hero .in{position:relative;z-index:2}
.kicker{display:inline-block;font:700 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  background:rgba(255,255,255,.16);padding:6px 11px;border-radius:100px;margin-bottom:14px}
.num{display:block;font-family:var(--sans);font-stretch:113%;font-weight:800;font-size:56px;
  line-height:.92;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.num.sm{font-size:38px}
.say{font-size:14.5px;margin-top:10px;opacity:.92;max-width:34ch}

/* ---- body ---------------------------------------------------------------- */
.body{padding:18px 20px 26px}
.zh{font:700 10px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--sect);
  display:flex;align-items:center;gap:10px;margin:22px 0 4px}
.zh:first-child{margin-top:0}
.zh::after{content:"";flex:1;height:1px;background:var(--rule)}
.rw{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule)}
.rw:last-child{border-bottom:0}
.tx{flex:1;min-width:0;font-size:14.5px;font-weight:500}
.tx s{display:block;text-decoration:none;font-size:12.5px;line-height:1.35;color:var(--ink3);
  font-weight:500;margin-top:3px}
.v{font:700 15px/1 var(--mono);font-variant-numeric:tabular-nums;flex:0 0 auto}
.v.g{color:var(--green)} .v.p{color:var(--pink)} .v.d{color:var(--ink3)}
.bul{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.bul.g{background:var(--green-lift)} .bul.a{background:var(--amber-lift)}
.bul.p{background:var(--pink)} .bul.r{background:var(--red-lift)}
.mult{font:700 9.5px/1 var(--mono);background:var(--green-soft);color:var(--green);
  padding:4px 6px;border-radius:5px;flex:0 0 auto}
.rw.exp{cursor:pointer;-webkit-tap-highlight-color:transparent}
.rw.exp::after{content:'';width:7px;height:7px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);
  transform:rotate(45deg);margin:0 3px 3px 2px;flex:0 0 auto;transition:transform .15s}
.rw.exp.open::after{transform:rotate(-135deg);margin:3px 3px 0 2px}
.rw.exp.open{border-bottom-color:transparent}
.dd{padding:0 0 10px 20px;border-bottom:1px solid var(--rule)}
.mr{padding:10px 0 6px}
.mr+.mr{border-top:1px dashed var(--rule)}
.mh{display:flex;align-items:center;gap:8px}
.flag{font:700 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:100px;flex:0 0 auto}
.flag.red{background:var(--red-soft);color:var(--red)}
.flag.yellow{background:var(--amber-soft);color:var(--amber)}
.flag.grey{background:var(--alt);color:var(--ink3)}
.mw{margin-left:auto;font:600 12.5px/1 var(--mono);color:var(--ink2);text-align:right}
.ms{margin:7px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink)}
.md{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink2)}
@media (prefers-reduced-motion: reduce){.rw.exp::after{transition:none}}
.note{background:var(--alt);border-radius:14px;padding:13px 15px;margin-top:16px;
  font-size:13px;line-height:1.5;color:var(--ink2)}
.note b{display:block;font:700 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:7px}
.card{background:var(--alt);border-radius:16px;padding:15px 16px;margin-top:14px}
.card .k{font:700 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.card .b{font-family:var(--sans);font-stretch:113%;font-weight:800;font-size:30px;line-height:1;
  letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
.card .s{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.45}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.pair>div{background:var(--alt);border-radius:12px;padding:11px 12px}
.pair .k{font:500 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.pair .v2{font:700 17px/1 var(--mono);margin-top:7px;font-variant-numeric:tabular-nums}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;
  background:linear-gradient(150deg,var(--pink),#E0107F 55%,var(--pink-deep));
  color:#fff;text-decoration:none;border-radius:100px;padding:15px 20px;font-weight:700;font-size:15px;
  box-shadow:0 6px 18px rgba(250,24,150,.28)}
.act small{font:700 11px/1 var(--mono);opacity:.85}
/* The bar is fixed, so the last element in the flow has to carry its own
   clearance. Relying on body padding-bottom left this pill half under the bar
   at maximum scroll. */
.act{margin-bottom:calc(14px + env(safe-area-inset-bottom))}
.honest{font-size:12px;line-height:1.5;color:var(--ink3);margin-top:18px;
  padding-top:14px;border-top:1px solid var(--rule)}

/* ---- tabs ---------------------------------------------------------------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--paper);border-top:1px solid var(--rule);
  padding:4px 4px calc(3px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.tab{flex:1;background:none;border:0;font:700 11.5px/1 var(--mono);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink3);display:flex;flex-direction:column;align-items:center;
  gap:5px;padding:4px 0;cursor:pointer;font-family:var(--mono)}
.tab svg{width:23px;height:23px}
.tab[aria-current="true"]{color:var(--sect)}
.tab.mid{position:relative;justify-content:flex-start}
/* The home button is the brand mark, so it should read as one colour. The old
   gradient ran down into #C40F75, which meant most of the circle was not the
   brand pink at all. Now it is #FA1896 with one soft lift top-left, and bigger,
   so more of that pink shows around a chevron that has not changed size. */
.tab.mid .hb{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-top:-30px;border:4px solid var(--paper);
  background:radial-gradient(70% 70% at 30% 20%,rgba(255,255,255,.28),transparent 62%),var(--pink);
  box-shadow:0 10px 24px rgba(250,24,150,.42),0 2px 6px rgba(250,24,150,.3)}
.tab.mid .hb svg{width:22px;height:30px;color:#fff}
.tab.mid:active .hb{transform:scale(.95)}
.tab.mid .hb{transition:transform .12s ease}

/* ---- states -------------------------------------------------------------- */
.state{min-height:100vh;min-height:100dvh;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 26px calc(40px + env(safe-area-inset-bottom));text-align:center}
.state h2{font-family:var(--sans);font-stretch:113%;font-weight:800;font-size:26px;
  letter-spacing:-.03em;line-height:1.1}
.state p{color:var(--ink2);margin-top:12px;font-size:14.5px;line-height:1.5}
.state .mk{width:52px;height:71px;color:var(--pink);margin:0 auto 22px;display:block}

/* The splash. Not a state screen with a different colour: the loading moment is
   the brand mark, so it is the ground, the words, and the chevrons under them. */
.state,.splash{margin-bottom:calc(-24px - env(safe-area-inset-bottom))}
.splash{position:fixed;inset:0;z-index:60;background:#F41886;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 26px;text-align:center}
.splash h2{font-family:var(--sans);font-stretch:113%;font-weight:800;
  font-size:31px;line-height:1.12;letter-spacing:-.025em;color:#fff;margin:0}
/* The mark is the supplied artwork, already composited on #FA1896, so it needs
   no colour of its own and has no cutout edge to fringe against the ground. */
.splash .mk{width:112px;height:auto;margin:28px auto 0;display:block}
@media (prefers-reduced-motion:no-preference){
  .splash .mk{animation:lift 1.9s cubic-bezier(.4,0,.3,1) infinite}
  @keyframes lift{0%,100%{transform:translateY(4px);opacity:.85}
                  50%{transform:translateY(-4px);opacity:1}}
}
.state a{display:inline-block;margin-top:20px;background:var(--pink);color:#fff;text-decoration:none;
  border-radius:100px;padding:13px 22px;font-weight:700;font-size:14.5px}
.handoff{margin:30px 20px calc(104px + env(safe-area-inset-bottom));text-align:center}
.handoff a{display:inline-block;background:var(--pink);color:#fff;text-decoration:none;
  border-radius:100px;padding:12px 20px;font-weight:700;font-size:14.5px}
.handoff p{margin:11px 0 0;color:var(--ink3);font-size:12.5px;line-height:1.45;
  max-width:280px;margin-left:auto;margin-right:auto}
html.inapp .handoff{display:none}
.skel{height:13px;border-radius:6px;background:var(--rule);animation:p 1.3s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.45}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
